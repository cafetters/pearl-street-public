# D58 margin test (pre-registered, docs/plans/d58_margin_report.md). Window jul01, margin 1 $/MWh.
# Copy of configs/h2h/h2h_c_jul01_h100.yaml with only run_name, peak_price_cap_usd_mwh, settlement_reference, peak_response_margin_usd_mwh set.
# Overnight breadth (pre-registered in docs/overnight/2026-10-26.md); supplementary to D53.
# Head-to-head (D49, D53), arm C (price mode, D53), 2023-07-01 to 2023-07-02, 100 MW. Pre-registered: no tuning between runs.
run_name: h2h_c_jul01_h100_m1
data_dir: ../data             # relative to repo root; Engie data is never copied in
start: 2023-07-01
end: 2023-07-02
slice_tz: America/Chicago
agents: all
zone: SYS                     # one zone, the whole system, until the stressed grid (D9, D10)
operator_id: GRID_OP
metering_id: metering
clock_id: clock
headroom_mw: [100]   # target = forecast day peak - headroom
layer_mw: 25
price_cap_usd_mwh: 500        # placeholder until Q-N1 (avoided cost)
post_hour_local: 9            # day D's needs posted 09:00 on D-1
gate_lead_h: 1
price_publish_hour_local: 12  # day-ahead prices for D published 12:00 on D-1
forecast_noise_sigma: 0.0
seed: 1
min_offer_kw: 50
wear_usd_mwh: 10              # same as bench.py DEG
nominations: true             # agents publish planned site net; operator sees only the zone total
rounds: info                  # by information: residual rounds until one closes after price-informed nominations (D32)
nomination_lead_h: 1          # nomination deadline, after the previous round's gate
imbalance_band_pct: 0.05      # free band: max(5% of battery power, 50 kW) per step
imbalance_band_min_kw: 50     # deviation beyond it pays the zone scarcity price (price_cap, placeholder)
compare_to: none   # no side-by-side (other windows have no M1.1 run)
# Arm C: price mode in the exchange (D53). No needs, offers or awards; nominations, binding calls, imbalance,
# D46 and D48 as in arm A. v3's rules: alpha = rho / N, rho0 from the first day's day-ahead spread / median power,
# residual balancing on the scaled dual residual, textbook prox centre.
release_superseded_lock: true  # an announced binding call releases the earlier lock for its steps (D46)
plan_to_nomination: true       # plan to the nomination exactly; the band is for forecast error (D48)
price_mode: true               # D53
price_rounds_per_gate: 30      # pre-registered by timing: 30 if a full run projects under 30 min, else 20
price_rounds_basis: "timing check Oct 26 (runs/h2h_c_timing, 80 agents, 2 rounds per gate): 11.6 s per round, about 33 s otherwise; worst case 4 gates x 30 rounds projects about 24 min, under 30, so 30"
peak_price_cap_usd_mwh: 100
price_rb_mu: 10                # residual balancing (Boyd et al. 2011, sec. 3.4.1), as prototype v3
price_rb_tau: 2
price_rho_floor: 1000          # rho within rho0 / 1000 ...
price_rho_cap: 10              # ... and 10 x rho0
price_tol_excess_mw: 1.0       # a gate converges at max excess <= 1 MW ...
price_tol_dual_usd_mwh: 6.0    # ... and dual residual <= 6 $/MWh ...
price_streak: 3                # ... for 3 rounds in a row
prox_deadzone_usd_mwh: 0.05    # secant prox: largest kink slope at zero change
m0_dir: runs/m0_jul01   # this window's M0 ceiling
settlement_reference: selfish_1p
peak_response_margin_usd_mwh: 1.0
